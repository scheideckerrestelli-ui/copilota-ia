<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Co-Driver Beta</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://codriver.pages.dev/beta">
<!-- La pagina della beta vive su codriver.pages.dev dal 30/08. Questa copia su
     github.io restava viva col modulo vecchio, e dal 17/09 rimanda alla nuova
     (decisione di Tiago). Si portano dietro ?lang= e #termini, che la pagina
     nuova legge. Senza JavaScript vale il meta refresh, che perde solo la lingua. -->
<script>location.replace('https://codriver.pages.dev/beta' + location.search + location.hash);</script>
<meta http-equiv="refresh" content="0; url=https://codriver.pages.dev/beta">
<style>
  :root{ --ground:#F2F3F5; --ink:#14181D; --soft:#59636E; --accent:#D31C55; }
  @media (prefers-color-scheme:dark){
    :root{ --ground:#101418; --ink:#E8EBEE; --soft:#9AA5B0; --accent:#FF4E7E; }
  }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
        box-sizing:border-box; background:var(--ground); color:var(--ink);
        font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main{ max-width:32rem; }
  p{ margin:0 0 .6rem; }
  .altre{ color:var(--soft); font-size:.9rem; }
  a{ color:var(--accent); font-weight:600; }
</style>
</head>
<body>
<main>
  <p>La pagina della beta si è spostata: <a href="https://codriver.pages.dev/beta">codriver.pages.dev/beta</a></p>
  <p class="altre">The beta page has moved. La page de la bêta a déménagé.</p>
</main>
</body>
</html>
